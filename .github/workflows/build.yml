name: Build Fabric 1.21.10 Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Fix gradle.properties
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i 's/mcVer=1.21.11/mcVer=1.21.10/g' gradle.properties

      - name: Download Dependencies
        run: |
          mkdir -p jars
          curl -L -s -o jars/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar https://cdn.modrinth.com/data/uCdwusMi/versions/CKJFSOC6/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar
          curl -L -s -o jars/VulkanMod_1.21.10-0.6.6.jar https://cdn.modrinth.com/data/JYQhtZtO/versions/jkDMvvWU/VulkanMod_1.21.10-0.6.6.jar

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Compile Fabric Mod
        run: |
          ./gradlew :vulkan:remapJar :vulkan:build -x test -PmcVer="1.21.10" -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace 2>&1 | tee build.log || true
          mkdir -p output_single_mod
          # Отбираем строго готовый релизный jar для Fabric (отсеивая dev, sources, javadoc)
          TARGET=$(find vulkan/build/libs build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-javadoc.jar" ! -name "*-all.jar" 2>/dev/null | head -n 1)
          if [ -z "$TARGET" ]; then
            TARGET=$(find . -name "*.jar" ! -path "./jars/*" ! -path "./.gradle/*" ! -name "*-sources.jar" ! -name "*-dev.jar" 2>/dev/null | head -n 1)
          fi
          cp -v "$TARGET" output_single_mod/DistantHorizons-VulkanMod-Fabric-1.21.10.jar

      - name: Upload Single Fabric Jar
        uses: actions/upload-artifact@v4
        with:
          name: DistantHorizons-VulkanMod-Fabric-1.21.10
          path: output_single_mod/DistantHorizons-VulkanMod-Fabric-1.21.10.jar
          if-no-files-found: error

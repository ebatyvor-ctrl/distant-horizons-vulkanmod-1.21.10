name: Build Distant Horizons VulkanMod 1.21.10

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Fix gradle.properties
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i 's/mcVer=1.21.11/mcVer=1.21.10/g' gradle.properties

      - name: Download Dependency Jars (DH & VulkanMod 1.21.10)
        run: |
          mkdir -p jars
          echo "Downloading Distant Horizons 1.21.10..."
          curl -L -s -o jars/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar https://cdn.modrinth.com/data/uCdwusMi/versions/CKJFSOC6/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar
          echo "Downloading VulkanMod 1.21.10..."
          curl -L -s -o jars/VulkanMod_1.21.10-0.6.6.jar https://cdn.modrinth.com/data/JYQhtZtO/versions/jkDMvvWU/VulkanMod_1.21.10-0.6.6.jar
          ls -la jars/

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: |
          ./gradlew :vulkan:remapJar :vulkan:build -x test -PmcVer="1.21.10" -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace 2>&1 | tee build.log || true
          echo "=== SEARCHING FOR ALL BUILT JARS ==="
          mkdir -p final_output
          find . -name "*.jar" ! -path "./jars/*" ! -path "./.gradle/*" -exec cp -v {} final_output/ \;
          ls -la final_output/

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Built Jar
        uses: actions/upload-artifact@v4
        with:
          name: distant-horizons-vulkanmod-1.21.10-jar
          path: final_output/*.jar
          if-no-files-found: warn
